name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni al
        uses: actions/checkout@v4

      - name: Flutter gur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter taslamasyny döret
        run: |
          flutter create --project-name tkm_telefon_ussa build_app

      - name: SHA-1 almak
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list -v \
            -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android | grep "SHA1:"

      - name: Kodlary göçür
        run: |
          cp lib/main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/android/app
          cp android/app/google-services.json build_app/android/app/google-services.json

      - name: Firebase plugin goş
        working-directory: build_app
        run: |
          sed -i '/plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts

      - name: Paketleri taýýarla
        working-directory: build_app
        run: flutter pub get

      - name: APK döret
        working-directory: build_app
        run: flutter build apk --release

      - name: APK-ni ýükle
        uses: actions/upload-artifact@v4
        with:
          name: tkm-telefon-ussa-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
